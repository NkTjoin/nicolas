<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NicoDev | Building Game</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      background:
        radial-gradient(circle at top, rgba(251,191,36,.22), transparent 35%),
        radial-gradient(circle at bottom right, rgba(37,99,235,.30), transparent 35%),
        #020617;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 18px;
      overflow: hidden;
    }

    .card {
      width: min(940px, 100%);
      background: rgba(15,23,42,.9);
      border: 1px solid rgba(251,191,36,.25);
      border-radius: 32px;
      padding: 28px;
      text-align: center;
      box-shadow: 0 30px 90px rgba(0,0,0,.45);
    }

    h1 {
      font-size: clamp(38px, 7vw, 60px);
      margin: 0 0 10px;
    }

    p {
      color: #cbd5e1;
      margin: 0 auto 16px;
      max-width: 650px;
      line-height: 1.6;
    }

    input {
      padding: 14px;
      border-radius: 14px;
      border: 1px solid rgba(251,191,36,.35);
      background: #020617;
      color: white;
      outline: none;
      width: min(320px, 100%);
      margin: 12px 0;
    }

    button {
      border: none;
      cursor: pointer;
      padding: 13px 18px;
      border-radius: 15px;
      background: linear-gradient(135deg, #f97316, #fbbf24);
      color: #111827;
      font-weight: bold;
      margin: 6px;
      transition: .2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(251,191,36,.22);
    }

    .game {
      position: relative;
      width: 100%;
      height: min(44vh, 350px);
      min-height: 260px;
      margin: 18px auto;
      border-radius: 26px;
      background: rgba(2,6,23,.62);
      border: 1px solid rgba(148,163,184,.16);
      overflow: hidden;
      display: none;
      cursor: crosshair;
    }

    .ground {
      position: absolute;
      bottom: 34px;
      left: 5%;
      width: 90%;
      height: 8px;
      border-radius: 999px;
      background: repeating-linear-gradient(
        45deg,
        #fbbf24,
        #fbbf24 14px,
        #111827 14px,
        #111827 28px
      );
    }

    .worker {
      position: absolute;
      bottom: 48px;
      left: 9%;
      font-size: 38px;
      animation: walk 2.2s infinite alternate ease-in-out;
    }

    .building {
      position: absolute;
      right: 8%;
      bottom: 42px;
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    .block {
      width: 42px;
      border-radius: 10px 10px 0 0;
      background: rgba(30,41,59,.96);
      border: 1px solid rgba(251,191,36,.25);
    }

    .block:nth-child(1) { height: 70px; }
    .block:nth-child(2) { height: 110px; }
    .block:nth-child(3) { height: 150px; }

    .falling {
      position: absolute;
      top: -45px;
      font-size: 36px;
      user-select: none;
      animation: fall linear forwards;
      filter: drop-shadow(0 0 10px rgba(251,191,36,.35));
    }

    @keyframes fall {
      to { transform: translateY(430px) rotate(130deg); }
    }

    @keyframes walk {
      from { transform: translateX(0); }
      to { transform: translateX(45px); }
    }

    .hud {
      display: none;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: center;
      margin-top: 12px;
    }

    .progress-wrap {
      background: #111827;
      height: 14px;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid rgba(251,191,36,.25);
    }

    .progress {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #f97316, #fbbf24);
      border-radius: 999px;
      transition: width .25s ease;
      box-shadow: 0 0 18px rgba(251,191,36,.45);
    }

    .stats {
      color: #fde68a;
      font-family: Consolas, monospace;
      font-size: 15px;
      white-space: nowrap;
    }

    .best {
      margin-top: 16px;
      color: #93c5fd;
      font-family: Consolas, monospace;
      font-size: 15px;
    }

    .hidden { display: none; }

    footer {
      margin-top: 18px;
      color: #64748b;
      font-size: 14px;
    }

    @media (max-width: 650px) {
      .card { padding: 20px; border-radius: 24px; }
      .hud { grid-template-columns: 1fr; }
      .stats { font-size: 14px; }
      .building { right: 3%; transform: scale(.85); transform-origin: bottom right; }
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>Building...</h1>

    <p>
      Sitio en construcción. Ingresá tu nombre y juntá materiales
      hasta completar el 100% lo más rápido posible.
    </p>

    <section id="startScreen">
      <input id="playerName" placeholder="Tu nombre" maxlength="16" />
      <br />
      <button onclick="startGame()">Empezar obra 🚧</button>
    </section>

    <section class="game" id="game">
      <div class="worker">👷</div>

      <div class="building">
        <div class="block"></div>
        <div class="block"></div>
        <div class="block"></div>
      </div>

      <div class="ground"></div>
    </section>

    <section class="hud" id="hud">
      <div class="progress-wrap">
        <div class="progress" id="progress"></div>
      </div>

      <div class="stats" id="stats">
        tiempo: 0.0s | progreso: 0%
      </div>
    </section>

    <section id="endScreen" class="hidden">
      <h2 id="finalText"></h2>
      <button onclick="startGame()">Intentar mejorar tiempo</button>
    </section>

    <div class="best" id="bestTime">
      Mejor tiempo: todavía no hay
    </div>

    <footer>
      Future System Engineer • NicoDev
    </footer>
  </main>

  <script>
    const game = document.getElementById("game");
    const playerNameInput = document.getElementById("playerName");
    const startScreen = document.getElementById("startScreen");
    const endScreen = document.getElementById("endScreen");
    const finalText = document.getElementById("finalText");
    const hud = document.getElementById("hud");
    const progressBar = document.getElementById("progress");
    const stats = document.getElementById("stats");
    const bestTimeBox = document.getElementById("bestTime");

    const items = ["🧱", "🔧", "⚙️", "🚧", "👷‍♂️"];

    let player = "";
    let progress = 0;
    let startTime = 0;
    let playing = false;
    let spawnInterval;
    let timerInterval;

    function getBest() {
      return JSON.parse(localStorage.getItem("best_build_time") || "null");
    }

    function saveBest(name, time) {
      const best = getBest();

      if (!best || time < best.time) {
        localStorage.setItem("best_build_time", JSON.stringify({ name, time }));
      }

      renderBest();
    }

    function renderBest() {
      const best = getBest();

      if (!best) {
        bestTimeBox.textContent = "Mejor tiempo: todavía no hay";
        return;
      }

      bestTimeBox.textContent =
        "Mejor tiempo: " + best.name + " — " + best.time.toFixed(1) + "s";
    }

    function startGame() {
      const name = playerNameInput.value.trim();

      if (!name) {
        alert("Poné un nombre primero 😄");
        return;
      }

      player = name;
      progress = 0;
      playing = true;
      startTime = Date.now();

      startScreen.classList.add("hidden");
      endScreen.classList.add("hidden");
      game.style.display = "block";
      hud.style.display = "grid";

      game.querySelectorAll(".falling").forEach(el => el.remove());

      clearInterval(spawnInterval);
      clearInterval(timerInterval);

      spawnInterval = setInterval(spawnItem, 650);

      timerInterval = setInterval(updateStats, 100);

      updateStats();
    }

    function updateStats() {
      if (!playing) return;

      const elapsed = (Date.now() - startTime) / 1000;

      progressBar.style.width = progress + "%";
      stats.textContent =
        "tiempo: " + elapsed.toFixed(1) + "s | progreso: " + progress + "%";
    }

    function spawnItem() {
      if (!playing) return;

      const item = document.createElement("div");
      item.className = "falling";
      item.textContent = items[Math.floor(Math.random() * items.length)];

      item.style.left = Math.random() * (game.clientWidth - 50) + "px";

      const duration = 1.7 + Math.random() * 1.1;
      item.style.animationDuration = duration + "s";

      item.onclick = () => {
        progress += 10;

        if (progress > 100) {
          progress = 100;
        }

        item.remove();
        updateStats();

        if (progress >= 100) {
          endGame();
        }
      };

      game.appendChild(item);

      setTimeout(() => {
        item.remove();
      }, duration * 1000);
    }

    function endGame() {
      playing = false;

      clearInterval(spawnInterval);
      clearInterval(timerInterval);

      const finalTime = (Date.now() - startTime) / 1000;

      game.querySelectorAll(".falling").forEach(el => el.remove());

      game.style.display = "none";
      hud.style.display = "none";
      endScreen.classList.remove("hidden");

      finalText.textContent =
        player + ", terminaste la obra en " + finalTime.toFixed(1) + "s 🚧";

      saveBest(player, finalTime);
    }

    renderBest();
  </script>
</body>
</html>
