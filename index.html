<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NicoDev | Building</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      background:
        radial-gradient(circle at top, rgba(251, 191, 36, 0.20), transparent 35%),
        radial-gradient(circle at bottom right, rgba(37, 99, 235, 0.28), transparent 35%),
        #020617;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
    }

    .card {
      width: 100%;
      max-width: 850px;
      background: rgba(15, 23, 42, 0.86);
      border: 1px solid rgba(251, 191, 36, 0.25);
      border-radius: 34px;
      padding: 42px;
      text-align: center;
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(16px);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(251, 191, 36, 0.12);
      border: 1px solid rgba(251, 191, 36, 0.35);
      color: #fde68a;
      font-size: 14px;
      letter-spacing: 1px;
      margin-bottom: 22px;
    }

    .helmet {
      font-size: 34px;
      animation: bounce 1.4s infinite alternate;
    }

    h1 {
      font-size: 54px;
      margin: 0 0 14px;
      line-height: 1;
    }

    p {
      color: #cbd5e1;
      font-size: 18px;
      line-height: 1.7;
      margin: 0 auto 28px;
      max-width: 620px;
    }

    .scene {
      position: relative;
      height: 290px;
      margin: 25px auto 30px;
      max-width: 650px;
      border-radius: 28px;
      background:
        linear-gradient(180deg, rgba(15,23,42,0.35), rgba(2,6,23,0.65));
      border: 1px solid rgba(148, 163, 184, 0.15);
      overflow: hidden;
    }

    .ground {
      position: absolute;
      bottom: 35px;
      left: 6%;
      width: 88%;
      height: 8px;
      border-radius: 999px;
      background: repeating-linear-gradient(
        45deg,
        #fbbf24,
        #fbbf24 14px,
        #111827 14px,
        #111827 28px
      );
      box-shadow: 0 0 18px rgba(251, 191, 36, 0.25);
    }

    .tower {
      position: absolute;
      bottom: 42px;
      left: 130px;
      width: 28px;
      height: 190px;
      border: 2px solid #fbbf24;
      border-radius: 8px;
      background: repeating-linear-gradient(
        45deg,
        transparent 0 12px,
        rgba(251, 191, 36, 0.55) 12px 18px
      );
    }

    .arm {
      position: absolute;
      left: 133px;
      bottom: 218px;
      width: 330px;
      height: 18px;
      border-radius: 999px;
      background: linear-gradient(90deg, #fbbf24, #f97316);
      transform-origin: left center;
      animation: craneMove 3s ease-in-out infinite alternate;
      box-shadow: 0 0 25px rgba(251, 191, 36, 0.35);
    }

    .cable {
      position: absolute;
      top: 18px;
      right: 55px;
      width: 3px;
      height: 90px;
      background: #fde68a;
      animation: cableMove 2s ease-in-out infinite alternate;
    }

    .box {
      position: absolute;
      left: -26px;
      bottom: -48px;
      width: 58px;
      height: 34px;
      border-radius: 8px;
      background: linear-gradient(135deg, #f97316, #fbbf24);
      border: 1px solid rgba(255,255,255,0.35);
      box-shadow: 0 0 22px rgba(251, 191, 36, 0.35);
    }

    .building {
      position: absolute;
      right: 75px;
      bottom: 43px;
      display: flex;
      align-items: flex-end;
      gap: 9px;
    }

    .block {
      width: 44px;
      border-radius: 10px 10px 0 0;
      background: rgba(30, 41, 59, 0.95);
      border: 1px solid rgba(251, 191, 36, 0.25);
    }

    .block:nth-child(1) { height: 65px; }
    .block:nth-child(2) { height: 105px; }
    .block:nth-child(3) { height: 145px; }

    .worker {
      position: absolute;
      left: 65px;
      bottom: 50px;
      font-size: 38px;
      animation: walk 2.4s ease-in-out infinite alternate;
    }

    .progress-wrap {
      margin-top: 8px;
      background: #111827;
      height: 14px;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid rgba(251, 191, 36, 0.25);
    }

    .progress {
      height: 100%;
      width: 35%;
      background: linear-gradient(90deg, #f97316, #fbbf24);
      border-radius: 999px;
      transition: width 0.4s ease;
      box-shadow: 0 0 18px rgba(251, 191, 36, 0.45);
    }

    .info {
      margin-top: 16px;
      color: #fde68a;
      font-family: Consolas, monospace;
      font-size: 15px;
    }

    button {
      margin-top: 24px;
      border: none;
      cursor: pointer;
      padding: 14px 20px;
      border-radius: 16px;
      background: linear-gradient(135deg, #f97316, #fbbf24);
      color: #111827;
      font-weight: bold;
      font-size: 15px;
      transition: 0.2s;
    }

    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(251, 191, 36, 0.25);
    }

    .tags {
      margin-top: 26px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .tag {
      padding: 10px 14px;
      border-radius: 14px;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(251, 191, 36, 0.18);
      color: #fde68a;
      font-size: 14px;
    }

    footer {
      margin-top: 28px;
      color: #64748b;
      font-size: 14px;
    }

    @keyframes craneMove {
      from { transform: rotate(-5deg); }
      to { transform: rotate(7deg); }
    }

    @keyframes cableMove {
      from { height: 72px; }
      to { height: 108px; }
    }

    @keyframes walk {
      from { transform: translateX(0); }
      to { transform: translateX(45px); }
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-8px); }
    }

    @media (max-width: 700px) {
      .card {
        padding: 30px 20px;
      }

      h1 {
        font-size: 38px;
      }

      p {
        font-size: 16px;
      }

      .scene {
        transform: scale(0.82);
        margin: -15px auto 5px;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="badge">
      <span class="helmet">👷‍♂️</span>
      NICODEV.LAT
    </div>

    <h1>Building...</h1>

    <p>
      Este sitio está en construcción. Estoy preparando mi portfolio
      sobre Linux, infraestructura, servidores, cloud y sistemas.
    </p>

    <section class="scene">
      <div class="worker">👷</div>
      <div class="tower"></div>

      <div class="arm">
        <div class="cable">
          <div class="box"></div>
        </div>
      </div>

      <div class="building">
        <div class="block"></div>
        <div class="block"></div>
        <div class="block"></div>
      </div>

      <div class="ground"></div>
    </section>

    <div class="progress-wrap">
      <div class="progress" id="progress"></div>
    </div>

    <div class="info" id="info">
      progreso: 35% | estado: construyendo...
    </div>

    <button onclick="buildMore()">
      Construir un poco más 🚧
    </button>

    <div class="tags">
      <span class="tag">Linux</span>
      <span class="tag">Cloudflare</span>
      <span class="tag">Networking</span>
      <span class="tag">Infrastructure</span>
    </div>

    <footer>
      Future System Engineer • NicoDev
    </footer>
  </main>

  <script>
    let progress = 35;

    function buildMore() {
      progress += 10;

      if (progress > 100) {
        progress = 35;
      }

      document.getElementById("progress").style.width = progress + "%";

      const status = progress === 100
        ? "deploy listo, pero sigo aprendiendo"
        : "construyendo...";

      document.getElementById("info").textContent =
        "progreso: " + progress + "% | estado: " + status;
    }
  </script>
</body>
</html>
