<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mirko 💀</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body{
      height:100vh;
      overflow:hidden;
      display:flex;
      justify-content:center;
      align-items:center;
      background:black;
      color:white;
      position:relative;
    }

    .bg{
      position:absolute;
      width:200%;
      height:200%;
      background:
        radial-gradient(circle at center, #ff00c8 0%, transparent 20%),
        radial-gradient(circle at top left, #00ffe1 0%, transparent 25%),
        radial-gradient(circle at bottom right, #ffea00 0%, transparent 25%);
      animation: moveBg 8s linear infinite;
      filter: blur(80px);
      opacity:0.8;
    }

    @keyframes moveBg{
      0%{ transform:rotate(0deg) scale(1); }
      50%{ transform:rotate(180deg) scale(1.2); }
      100%{ transform:rotate(360deg) scale(1); }
    }

    h1{
      font-size: clamp(3rem, 10vw, 8rem);
      z-index:2;
      text-transform:uppercase;
      text-align:center;
      animation: shake 0.2s infinite;
      text-shadow:
        0 0 10px #fff,
        0 0 20px #ff00c8,
        0 0 40px #ff00c8,
        0 0 80px #ff00c8;
    }

    .emoji{
      position:absolute;
      font-size:2rem;
      animation: fall linear infinite;
      opacity:0.8;
    }

    @keyframes shake{
      0%{ transform:translate(2px,2px); }
      25%{ transform:translate(-2px,2px); }
      50%{ transform:translate(2px,-2px); }
      75%{ transform:translate(-2px,-2px); }
      100%{ transform:translate(2px,2px); }
    }

    @keyframes fall{
      from{
        transform:translateY(-120vh) rotate(0deg);
      }
      to{
        transform:translateY(120vh) rotate(720deg);
      }
    }

    .sub{
      position:absolute;
      bottom:40px;
      font-size:1.2rem;
      opacity:0.8;
      z-index:2;
      animation: pulse 1s infinite;
    }

    @keyframes pulse{
      0%,100%{ transform:scale(1); }
      50%{ transform:scale(1.1); }
    }
  </style>
</head>
<body>

  <div class="bg"></div>

  <h1 id="texto">MIRKO GAY 💀</h1>

  <div class="sub">
    certificado oficialmente por internet
  </div>

  <script>
    const emojis = ["💀","🤨","🗿","🔥","💅","😭"];

    for(let i = 0; i < 50; i++){
      const e = document.createElement("div");
      e.classList.add("emoji");
      e.innerText = emojis[Math.floor(Math.random()*emojis.length)];

      e.style.left = Math.random() * 100 + "vw";
      e.style.animationDuration = (Math.random()*5 + 3) + "s";
      e.style.fontSize = (Math.random()*40 + 20) + "px";

      document.body.appendChild(e);
    }

    // texto loco que cambia
    const frases = [
      "MIRKO GAY 💀",
      "100% REAL NO FAKE 🔥",
      "CERTIFICADO 🗿",
      "MIRKO.EXE 😭",
      "TOP 1 FAN DE LOS PIBES 💅"
    ];

    let i = 0;

    setInterval(() => {
      i = (i + 1) % frases.length;
      document.getElementById("texto").innerText = frases[i];
    }, 2000);
  </script>

</body>
</html>
