<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NicoDev | En construcción</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      background:
        radial-gradient(circle at top left, rgba(37, 99, 235, 0.35), transparent 35%),
        radial-gradient(circle at bottom right, rgba(14, 165, 233, 0.25), transparent 35%),
        #020617;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      overflow: hidden;
    }

    .card {
      width: 100%;
      max-width: 760px;
      background: rgba(15, 23, 42, 0.82);
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 32px;
      padding: 52px;
      text-align: center;
      box-shadow: 0 30px 90px rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(59, 130, 246, 0.12);
      border: 1px solid rgba(96, 165, 250, 0.3);
      color: #93c5fd;
      font-size: 14px;
      letter-spacing: 1px;
      margin-bottom: 28px;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 16px #38bdf8;
    }

    h1 {
      font-size: 54px;
      margin: 0 0 18px;
      line-height: 1;
    }

    p {
      color: #cbd5e1;
      font-size: 18px;
      line-height: 1.7;
      max-width: 570px;
      margin: 0 auto 32px;
    }

    .crane-scene {
      position: relative;
      width: 100%;
      max-width: 520px;
      height: 230px;
      margin: 25px auto 35px;
    }

    .ground {
      position: absolute;
      bottom: 20px;
      left: 5%;
      width: 90%;
      height: 6px;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, #38bdf8, transparent);
      opacity: 0.55;
    }

    .tower {
      position: absolute;
      bottom: 25px;
      left: 34%;
      width: 20px;
      height: 145px;
      background: repeating-linear-gradient(
        45deg,
        #38bdf8,
        #38bdf8 6px,
        transparent 6px,
        transparent 13px
      );
      border: 2px solid rgba(125, 211, 252, 0.7);
      border-radius: 6px;
    }

    .arm {
      position: absolute;
      bottom: 160px;
      left: 34%;
      width: 245px;
      height: 18px;
      background: linear-gradient(90deg, #38bdf8, #2563eb);
      border-radius: 999px;
      transform-origin: left center;
      animation: craneMove 3s ease-in-out infinite alternate;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.35);
    }

    .cable {
      position: absolute;
      top: 18px;
      right: 38px;
      width: 3px;
      height: 70px;
      background: #93c5fd;
      animation: cableMove 2s ease-in-out infinite alternate;
    }

    .hook {
      position: absolute;
      bottom: -18px;
      left: -9px;
      width: 22px;
      height: 22px;
      border: 3px solid #e0f2fe;
      border-top: none;
      border-radius: 0 0 14px 14px;
    }

    .load {
      position: absolute;
      bottom: -52px;
      left: -24px;
      width: 52px;
      height: 30px;
      border-radius: 8px;
      background: rgba(37, 99, 235, 0.9);
      border: 1px solid rgba(147, 197, 253, 0.7);
      box-shadow: 0 0 22px rgba(37, 99, 235, 0.45);
    }

    .building {
      position: absolute;
      right: 9%;
      bottom: 26px;
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    .block {
      width: 34px;
      background: rgba(30, 41, 59, 0.95);
      border: 1px solid rgba(125, 211, 252, 0.25);
      border-radius: 8px 8px 0 0;
    }

    .block:nth-child(1) { height: 55px; }
    .block:nth-child(2) { height: 85px; }
    .block:nth-child(3) { height: 120px; }

    @keyframes craneMove {
      from {
        transform: rotate(-4deg);
      }
      to {
        transform: rotate(6deg);
      }
    }

    @keyframes cableMove {
      from {
        height: 62px;
      }
      to {
        height: 88px;
      }
    }

    .tags {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .tag {
      padding: 10px 14px;
      border-radius: 14px;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.18);
      color: #7dd3fc;
      font-size: 14px;
    }

    footer {
      margin-top: 32px;
      color: #64748b;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .card {
        padding: 36px 22px;
      }

      h1 {
        font-size: 38px;
      }

      p {
        font-size: 16px;
      }

      .crane-scene {
        transform: scale(0.85);
        margin: 0 auto 20px;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="badge">
      <span class="dot"></span>
      NICODEV.LAT
    </div>

    <h1>Sitio en construcción</h1>

    <p>
      Estoy preparando mi portfolio personal sobre Linux,
      infraestructura, servidores, cloud y sistemas.
    </p>

    <div class="crane-scene">
      <div class="ground"></div>

      <div class="tower"></div>

      <div class="arm">
        <div class="cable">
          <div class="hook"></div>
          <div class="load"></div>
        </div>
      </div>

      <div class="building">
        <div class="block"></div>
        <div class="block"></div>
        <div class="block"></div>
      </div>
    </div>

    <div class="tags">
      <span class="tag">Linux</span>
      <span class="tag">Cloudflare</span>
      <span class="tag">Infraestructura</span>
      <span class="tag">Networking</span>
    </div>

    <footer>
      Future System Engineer • NicoDev
    </footer>
  </main>
</body>
</html>
