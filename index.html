<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NicoDev | En construcción</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      background:
        radial-gradient(circle at top left, rgba(37, 99, 235, 0.35), transparent 35%),
        radial-gradient(circle at bottom right, rgba(14, 165, 233, 0.22), transparent 35%),
        #020617;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 760px;
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 32px;
      padding: 56px;
      text-align: center;
      box-shadow: 0 30px 90px rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(16px);
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(59, 130, 246, 0.12);
      border: 1px solid rgba(96, 165, 250, 0.3);
      color: #93c5fd;
      font-size: 14px;
      letter-spacing: 0.8px;
      margin-bottom: 28px;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 16px #38bdf8;
    }

    h1 {
      font-size: 56px;
      line-height: 1;
      margin: 0 0 20px;
    }

    p {
      max-width: 560px;
      margin: 0 auto;
      color: #cbd5e1;
      font-size: 18px;
      line-height: 1.8;
    }

    .line {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(148, 163, 184, 0.35), transparent);
      margin: 36px 0;
    }

    .stack {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .tag {
      padding: 10px 14px;
      border-radius: 14px;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.18);
      color: #7dd3fc;
      font-size: 14px;
    }

    footer {
      margin-top: 36px;
      color: #64748b;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .container {
        padding: 36px 24px;
      }

      h1 {
        font-size: 40px;
      }

      p {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="status">
      <span class="dot"></span>
      NICODEV.LAT
    </div>

    <h1>Sitio en construcción</h1>

    <p>
      Estoy preparando mi portfolio personal sobre Linux, infraestructura,
      servidores, cloud y sistemas.
    </p>

    <div class="line"></div>

    <div class="stack">
      <span class="tag">Linux</span>
      <span class="tag">Cloudflare</span>
      <span class="tag">GitHub Pages</span>
      <span class="tag">Infraestructura</span>
    </div>

    <footer>
      Future System Engineer • NicoDev
    </footer>
  </main>
</body>
</html>
