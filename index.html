<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NicoDev | Building</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      background:
        radial-gradient(circle at top, rgba(251,191,36,.22), transparent 35%),
        radial-gradient(circle at bottom right, rgba(37,99,235,.30), transparent 35%),
        #020617;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 18px;
      overflow: hidden;
    }

    .card {
      width: min(940px, 100%);
      max-height: 96vh;
      overflow: hidden;
      background: rgba(15,23,42,.88);
      border: 1px solid rgba(251,191,36,.25);
      border-radius: 32px;
      padding: 28px;
      text-align: center;
      box-shadow: 0 30px 90px rgba(0,0,0,.45);
      backdrop-filter: blur(16px);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 9px 15px;
      border-radius: 999px;
      background: rgba(251,191,36,.12);
      border: 1px solid rgba(251,191,36,.35);
      color: #fde68a;
      font-size: 14px;
      margin-bottom: 14px;
    }

    .helmet {
      font-size: 28px;
      animation: bounce 1.2s infinite alternate;
    }

    h1 {
      font-size: clamp(38px, 7vw, 62px);
      margin: 0 0 10px;
      line-height: 1;
    }

    p {
      color: #cbd5e1;
      font-size: clamp(15px, 2vw, 18px);
      line-height: 1.6;
      max-width: 650px;
      margin: 0 auto 18px;
    }

    .game {
      position: relative;
      width: 100%;
      height: min(45vh, 360px);
      min-height: 270px;
      margin: 18px auto;
      border-radius: 26px;
      background:
        linear-gradient(180deg, rgba(15,23,42,.25), rgba(2,6,23,.75));
      border: 1px solid rgba(148,163,184,.16);
      overflow: hidden;
      cursor: crosshair;
    }

    .ground {
      position: absolute;
      bottom: 34px;
      left: 5%;
      width: 90%;
      height: 8px;
      border-radius: 999px;
      background: repeating-linear-gradient(
        45deg,
        #fbbf24,
        #fbbf24 14px,
        #111827 14px,
        #111827 28px
      );
    }

    .building {
      position: absolute;
      right: 8%;
      bottom: 42px;
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    .block {
      width: 42px;
      border-radius: 10px 10px 0 0;
      background: rgba(30,41,59,.96);
      border: 1px solid rgba(251,191,36,.25);
    }

    .block:nth-child(1) { height: 70px; }
    .block:nth-child(2) { height: 110px; }
    .block:nth-child(3) { height: 150px; }

    .worker {
      position: absolute;
      bottom: 48px;
      left: 10%;
      font-size: 38px;
      animation: walk 2.2s infinite alternate ease-in-out;
    }

    .falling {
      position: absolute;
      top: -45px;
      font-size: 34px;
      user-select: none;
      animation: fall linear forwards;
      filter: drop-shadow(0 0 10px rgba(251,191,36,.35));
    }

    @keyframes fall {
      to { transform: translateY(430px) rotate(120deg); }
    }

    .hud {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: center;
      margin-top: 12px;
    }

    .progress-wrap {
      background: #111827;
      height: 14px;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid rgba(251,191,36,.25);
    }

    .progress {
      height: 100%;
      width: 20%;
      background: linear-gradient(90deg, #f97316, #fbbf24);
      border-radius: 999px;
      transition: width .25s ease;
      box-shadow: 0 0 18px rgba(251,191,36,.45);
    }

    .score {
      color: #fde68a;
      font-family: Consolas, monospace;
      font-size: 15px;
      white-space: nowrap;
    }

    .buttons {
      margin-top: 16px;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      cursor: pointer;
      padding: 12px 17px;
      border-radius: 15px;
      background: linear-gradient(135deg, #f97316, #fbbf24);
      color: #111827;
      font-weight: bold;
      transition: .2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(251,191,36,.23);
    }

    .tip {
      margin-top: 10px;
      color: #94a3b8;
      font-size: 14px;
    }

    footer {
      margin-top: 14px;
      color: #64748b;
      font-size: 14px;
    }

    @keyframes walk {
      from { transform: translateX(0); }
      to { transform: translateX(45px); }
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-6px); }
    }

    @media (max-width: 650px) {
      body { padding: 10px; }
      .card { padding: 20px; border-radius: 24px; }
      .game { min-height: 250px; height: 42vh; }
      .building { right: 3%; transform: scale(.85); transform-origin: bottom right; }
      .worker { left: 6%; }
      .hud { grid-template-columns: 1fr; }
      .score { font-size: 14px; }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="badge">
      <span class="helmet">👷‍♂️</span>
      NICODEV.LAT
    </div>

    <h1>Building...</h1>

    <p>
      Sitio en construcción. Mientras preparo mi portfolio,
      tocá los materiales que caen para avanzar la obra.
    </p>

    <section class="game" id="game">
      <div class="worker">👷</div>

      <div class="building">
        <div class="block"></div>
        <div class="block"></div>
        <div class="block"></div>
      </div>

      <div class="ground"></div>
    </section>

    <div class="hud">
      <div class="progress-wrap">
        <div class="progress" id="progress"></div>
      </div>

      <div class="score" id="score">
        progreso: 20% | puntos: 0
      </div>
    </div>

    <div class="buttons">
      <button onclick="spawnMaterial()">Soltar material 🚧</button>
      <button onclick="resetGame()">Reiniciar obra</button>
    </div>

    <div class="tip">
      Click en los ladrillos, cascos o herramientas antes de que caigan.
    </div>

    <footer>
      Future System Engineer • NicoDev
    </footer>
  </main>

  <script>
    const game = document.getElementById("game");
    const progressBar = document.getElementById("progress");
    const scoreText = document.getElementById("score");

    let score = 0;
    let progress = 20;

    const items = ["🧱", "🔧", "⚙️", "👷‍♂️", "🚧"];

    function updateHud() {
      progressBar.style.width = progress + "%";
      scoreText.textContent = "progreso: " + progress + "% | puntos: " + score;
    }

    function spawnMaterial() {
      const item = document.createElement("div");
      item.className = "falling";
      item.textContent = items[Math.floor(Math.random() * items.length)];

      const maxX = game.clientWidth - 50;
      item.style.left = Math.random() * maxX + "px";

      const duration = 2.4 + Math.random() * 1.5;
      item.style.animationDuration = duration + "s";

      item.onclick = function () {
        score += 1;
        progress += 5;

        if (progress > 100) {
          progress = 100;
        }

        item.remove();
        updateHud();

        if (progress === 100) {
          scoreText.textContent = "obra completa 🎉 | puntos: " + score;
        }
      };

      game.appendChild(item);

      setTimeout(() => {
        item.remove();
      }, duration * 1000);
    }

    function resetGame() {
      score = 0;
      progress = 20;
      document.querySelectorAll(".falling").forEach(el => el.remove());
      updateHud();
    }

    setInterval(() => {
      if (progress < 100) {
        spawnMaterial();
      }
    }, 1200);

    updateHud();
  </script>
</body>
</html>
